server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (Invicti: HSTS Policy Not Enabled, CVSS 7.7)
    # WARNING: if you ever add an `add_header` inside a `location`
    # block, ALL server-level add_header directives are dropped for
    # that location. This is nginx's documented inheritance
    # behavior. Either repeat them in the location or keep
    # add_header at server scope only.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression. nginx:alpine ships with `gzip off`, so every text asset was
    # going out raw. No brotli: the image has no ngx_brotli module.
    # NOTE: the add_header WARNING above does NOT apply here. add_header is an
    # array directive (a location-level entry drops the whole server-level
    # array); the gzip_* directives use plain nginx inheritance, so a location
    # keeps them unless it redefines that same directive. Neither location
    # below defines any gzip_*, so both inherit these as-is.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types application/javascript application/json
               text/css text/plain image/svg+xml application/wasm;

    # Hashed build assets (index-[hash].js, etc.): filename changes with
    # content, so cache forever. Cache-Control WITHOUT `always` so a 404
    # is never tagged immutable. Security headers repeated per the WARNING
    # above (a location-level add_header drops all server-level ones).
    location /assets/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Unhashed static assets from public/ (logo, favicons, fonts): the
    # filename never changes with content, so a one-week max-age, not
    # `immutable`. A logo swap propagates within the week. Security
    # headers repeated per the WARNING above (a location-level
    # add_header drops all server-level ones).
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2)$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # index.html + SPA fallback: never trust a stale copy. `no-cache` lets
    # the browser store it but forces revalidation (cheap 304 when
    # unchanged), so a plain reload always loads a fresh index pointing at
    # the new hashed bundles. Security headers repeated for the same reason.
    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
